[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-depth-token-mixer"
version = "0.1.0"
description = "Research scaffold for shared-KV multi-branch Transformers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
token-mixer = "token_mixer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
